[build]
publish = "dist"
command = "npm run build"

[build.environment]
NODE_VERSION = "20"

[[redirects]]
from = "/.well-known/*"
to = "/.well-known/:splat"
status = 200

[[redirects]]
from = "/mcp-runtime/*"
to = "/mcp-runtime/index.html"
status = 200

[[redirects]]
from = "/gnw/*"
to = "/gnw/index.html"
status = 200

[[redirects]]
from = "/genai4earth/*"
to = "/genai4earth/index.html"
status = 200
