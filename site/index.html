<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presentations</title>
  <link rel="icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Roboto+Condensed:wght@700&family=Roboto+Mono&display=swap">
  <style>
    :root {
      --primary: #CF3F02;
      --base: #443F3F;
      --muted: #6b6464;
      --bg: #ffffff;
      --card: #ffffff;
      --line: #e6e1e1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --base: #f3efef;
        --muted: #b9b1b1;
        --bg: #2b2727;
        --card: #353030;
        --line: #4a4343;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--base);
      font-family: Roboto, system-ui, sans-serif;
      line-height: 1.5;
    }
    main { max-width: 960px; margin: 0 auto; padding: 48px 16px 64px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 40px; }
    header img { height: 28px; }
    h1 {
      font-family: 'Roboto Condensed', sans-serif;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.1;
      margin: 0 0 8px;
    }
    .rule { width: 48px; height: 4px; background: var(--primary); border-radius: 2px; margin-bottom: 32px; }
    .decks { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
    a.deck {
      display: flex; flex-direction: column;
      color: inherit; text-decoration: none;
      background: var(--card);
      border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
      transition: border-color 0.15s, transform 0.15s;
    }
    a.deck:hover, a.deck:focus-visible { border-color: var(--primary); transform: translateY(-2px); }
    a.deck img { width: 100%; height: 140px; object-fit: cover; display: block; }
    .body { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 6px; flex-grow: 1; }
    .event { font-family: 'Roboto Mono', monospace; font-size: 0.8rem; color: var(--primary); }
    h2 { font-family: 'Roboto Condensed', sans-serif; font-size: 1.5rem; line-height: 1.15; margin: 0; }
    .sub { color: var(--muted); margin: 0; }
    .who { font-size: 0.9rem; margin-top: auto; padding-top: 10px; }
  </style>
</head>
<body>
  <main>
    <header>
      <picture>
        <source srcset="logo-dark.png" media="(prefers-color-scheme: dark)">
        <img src="logo.png" alt="Development Seed">
      </picture>
    </header>

    <h1>Presentations</h1>
    <div class="rule"></div>

    <div class="decks">
      <a class="deck" href="mcp-runtime/">
        <img src="mcp-runtime/images/theme/landsat8-ord-river-australia.jpg" alt="">
        <div class="body">
          <div class="event">Big Tent · Nov 2026</div>
          <h2>MCP Toolset Runtime</h2>
          <p class="sub">Tool data, handled in middleware</p>
          <div class="who">Ciaran Sweet · Daniel Wiesmann</div>
        </div>
      </a>

      <a class="deck" href="gnw/">
        <img src="gnw/images/theme/landsat9-western-guinea-bissau.jpg" alt="">
        <div class="body">
          <div class="event">Agentic AI for EO · Berlin · Oct 2026</div>
          <h2>Global Nature Watch Horizon</h2>
          <p class="sub">Geospatial AI in plain language</p>
          <div class="who">Daniel Wiesmann · Soumya Ranjan · Leo Thomas</div>
        </div>
      </a>
    </div>
  </main>
</body>
</html>
